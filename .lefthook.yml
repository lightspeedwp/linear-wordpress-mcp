---
# Lefthook configuration for Linear-WordPress MCP
# See https://evilmartians.com/chronicles/lefthook-knock-knock-whos-there

# Global configuration
min_nodejs_version: 18.0.0

# Pre-commit hook: run before git commit
pre-commit:
  # Branch validation using Claude branch-validation skill
  commands:
    branch-check:
      glob: ""  # Don't run on file changes, just once per commit
      run: |
        # Validate branch name format (feat/, fix/, docs/, etc.)
        BRANCH=$(git symbolic-ref --short HEAD)

        # Branch naming convention: {type}/{ticket-id}/{description}
        # Types: feature, bugfix, docs, refactor, test, chore, ci
        if [[ ! "$BRANCH" =~ ^(feature|bugfix|docs|refactor|test|chore|ci)/ ]]; then
          echo "❌ Invalid branch name: $BRANCH"
          echo ""
          echo "Branch naming convention:"
          echo "  Format: {type}/{ticket-id}/{description}"
          echo "  Types: feature, bugfix, docs, refactor, test, chore, ci"
          echo "  Example: feature/LW-123/add-linear-search"
          echo ""
          echo "To rename this branch:"
          echo "  git branch -m $BRANCH feature/LW-XXX/your-feature"
          exit 1
        fi
        echo "✅ Branch name is valid: $BRANCH"

    # Quality checks
    quality-check:
      glob: "{src,__tests__,tests}/**/*.{ts,js,sh}"
      run: |
        npm run quality-check || {
          echo ""
          echo "💡 Tip: Run 'npm run quality-check' locally to debug issues"
          exit 1
        }
      stage_fixed: true  # Auto-stage fixed files

    # Type checking
    type-check:
      glob: "src/**/*.ts"
      run: npm run typecheck
      stage_fixed: true

# Pre-push hook: run before git push
pre-push:
  commands:
    final-check:
      glob: ""  # Run once before push
      run: |
        echo "🚀 Running final quality checks before push..."
        npm run test:all
      stage_fixed: true

# Commit message hook: validate commit messages
commit-msg:
  commands:
    validate-commit:
      glob: ""  # Always run
      run: |
        MSG=$(cat "$1")

        # Commit message format:
        # {type}: {description}
        #
        # Supported types: feat, fix, docs, style, refactor, perf, test, chore
        if [[ ! "$MSG" =~ ^(feat|fix|docs|style|refactor|perf|test|chore|ci|build)(\(.+\))?:\ .{1,} ]]; then
          echo "❌ Invalid commit message format"
          echo ""
          echo "Commit message format:"
          echo "  {type}: {description}"
          echo ""
          echo "Examples:"
          echo "  feat: add Linear search by label"
          echo "  fix: handle empty WordPress response"
          echo "  docs: update API reference"
          echo "  test: add integration tests for linking"
          echo ""
          echo "Types: feat, fix, docs, style, refactor, perf, test, chore, ci, build"
          exit 1
        fi
        echo "✅ Commit message format is valid"

# Post-commit hook: informational
post-commit:
  commands:
    post-commit-info:
      glob: ""  # Run after every commit
      run: |
        BRANCH=$(git symbolic-ref --short HEAD)
        COMMIT=$(git rev-parse --short HEAD)
        echo ""
        echo "✅ Commit created: $COMMIT on $BRANCH"
        echo ""
        echo "Next steps:"
        echo "  1. Push: git push origin $BRANCH"
        echo "  2. Create PR on GitHub"
        echo "  3. Request code review"

# Skip hooks for certain commits (e.g., merge commits)
skip:
  - merge
  - rebase
  - fast-forward

# Environment setup for hooks
env:
  HUSKY: 0  # Disable Husky if installed
  NODE_ENV: development
